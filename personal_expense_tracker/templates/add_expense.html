{% extends "base.html" %}
{% block title %}{{ 'Edit Expense' if expense else 'Add Expense' }} — ExpenseTrack{% endblock %}

{% block content %}
<div class="mb-4">
  <h1 class="h4 fw-bold mb-1">{{ 'Edit Expense' if expense else 'Add New Expense' }}</h1>
  <p class="text-muted small mb-0">Record daily transactions with category and payment details.</p>
</div>

<div class="card border" style="max-width: 680px;">
  <div class="card-body p-4">
    <form method="post">
      <div class="row g-3">
        <div class="col-md-8">
          <label class="form-label fw-medium">Expense Title *</label>
          <input type="text" name="title" required maxlength="120" value="{{ expense.title if expense else '' }}" class="form-control" placeholder="e.g. Grocery shopping" />
        </div>
        <div class="col-md-4">
          <label class="form-label fw-medium">Amount (₹) *</label>
          <input type="number" name="amount" required min="0.01" step="0.01" value="{{ expense.amount if expense else '' }}" class="form-control font-monospace" placeholder="0.00" />
        </div>
        <div class="col-md-4">
          <label class="form-label fw-medium">Category *</label>
          <select name="category" required class="form-select">
            {% for cat in categories %}
            <option value="{{ cat }}" {% if expense and expense.category == cat %}selected{% endif %}>{{ cat }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-medium">Date *</label>
          <input type="date" name="date" required value="{{ expense.date if expense else today }}" class="form-control" />
        </div>
        <div class="col-md-4">
          <label class="form-label fw-medium">Payment Method *</label>
          <select name="payment_method" required class="form-select">
            {% for pm in payment_methods %}
            <option value="{{ pm }}" {% if expense and expense.payment_method == pm %}selected{% endif %}>{{ pm }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-12">
          <label class="form-label fw-medium">Description</label>
          <textarea name="description" rows="3" maxlength="300" class="form-control" placeholder="Optional notes...">{{ expense.description if expense else '' }}</textarea>
        </div>
      </div>

      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary">
          {{ 'Update Expense' if expense else 'Save Expense' }}
        </button>
        <a href="{{ url_for('expenses') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
